<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-label="Plan simplifié du lieu : couloir d’exposition autour de deux blocs, salle principale à droite">
  <!--
    Plan d’après le croquis des organisateurs (9 octobre) : couloir blanc autour de deux blocs
    hachurés au centre, salle principale (SP) à droite, zones non utilisées hachurées en haut et en
    bas à droite. Les pastilles des stations ne sont pas dessinées ici : l’application les superpose
    d’après x_pct / y_pct de content/vv26/stations.json (repère : ce viewBox, 1000 × 760).
  -->
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#E8EFF6"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#B9CBDD" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E7D4F"/>
    </marker>
  </defs>

  <!-- fond -->
  <rect width="1000" height="760" fill="#FAF6EC"/>

  <!-- couloir / exposition (tout l’espace blanc) -->
  <rect x="40" y="40" width="720" height="680" fill="#F6F1E4"/>
  <!-- salle principale -->
  <rect x="760" y="230" width="200" height="300" fill="#EEF0E3"/>

  <!-- blocs centraux et zones non utilisées -->
  <rect x="360" y="150" width="120" height="140" fill="url(#hatch)" stroke="#B9CBDD" stroke-width="3"/>
  <rect x="360" y="440" width="120" height="140" fill="url(#hatch)" stroke="#B9CBDD" stroke-width="3"/>
  <rect x="760" y="40" width="200" height="160" fill="url(#hatch)" stroke="#B9CBDD" stroke-width="3"/>
  <rect x="760" y="560" width="200" height="160" fill="url(#hatch)" stroke="#B9CBDD" stroke-width="3"/>
  <text x="860" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#7A8580">non utilisé</text>
  <text x="860" y="648" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#7A8580">non utilisé</text>

  <!-- libellés -->
  <text x="860" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#3F4A45">Salle</text>
  <text x="860" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#3F4A45">principale</text>
  <text x="860" y="486" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#5A6560">discussion collective</text>
  <text x="200" y="515" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#3F4A45">Couloir · exposition</text>

  <!-- murs -->
  <g fill="none" stroke="#3F4A45" stroke-width="10" stroke-linejoin="round">
    <!-- enceinte, ouverture d’entrée sur le mur gauche -->
    <path d="M40 330 V40 H960 V720 H40 V410"/>
    <!-- cloison du couloir vers la bande de droite, avec porte de la salle principale -->
    <path d="M760 40 V330 M760 410 V720"/>
    <!-- séparations de la salle principale -->
    <path d="M760 230 H960 M760 530 H960"/>
  </g>
  <!-- battants de porte -->
  <g fill="none" stroke="#3F4A45" stroke-width="4" stroke-dasharray="6 6">
    <path d="M40 330 A80 80 0 0 1 120 410"/>
    <path d="M760 330 A80 80 0 0 1 840 410"/>
  </g>

  <!-- entrée -->
  <line x1="-2" y1="370" x2="34" y2="370" stroke="#2E7D4F" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="52" y="440" width="150" height="40" rx="10" fill="#1E5C3A"/>
  <text x="127" y="467" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Entrée</text>
</svg>
