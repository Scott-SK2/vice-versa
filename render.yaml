# Blueprint Render : https://render.com/docs/blueprint-spec
# Déploie UNIQUEMENT le service web (image Docker du dépôt). La base PostgreSQL est créée à la main
# dans Render et son URL interne est collée dans DATABASE_URL : un redéploiement ne peut donc
# jamais la recréer ni la supprimer.
services:
  - type: web
    name: vice-versa
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # Internal Database URL de la base créée à la main (même région)
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://vice-versa.onrender.com # à corriger après création si Render attribue un autre nom ; sert aux QR
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: MEDIA_BASE_URL
        value: /media
      - key: EVENT_SLUG
        value: vv26
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: SEED_CONTENT_ON_START
        value: "true"
      - key: RATE_LIMIT_PARTICIPANT_PER_MIN
        value: "120"
      - key: RATE_LIMIT_SESSIONS_PER_IP_PER_MIN
        value: "120"
      - key: MAX_SESSIONS_PER_RUN
        value: "2000"
      - key: RETENTION_MONTHS
        value: "12"
